<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catatan Keuangan Usaha Gorengan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<style>
:root{
  /* Palet Merah & Kuning Hangat Elegan */
  --bg-page:#FFFDF5;          /* Latar kuning gading lembut */
  --bg-card:#FFFFFF;          /* Putih bersih untuk kartu */
  --bg-subtle:#FEF6D8;        /* Kuning lembut halus */
  --border-soft:#F3DEC0;      /* Garis batas kuning keemasan */
  --text-primary:#381818;     /* Merah kecokelatan gelap (nyaman dibaca) */
  --text-secondary:#70443B;   /* Cokelat kemerahan hangat */
  --text-muted:#9E766B;       /* Redup hangat */

  /* Merah Utama */
  --red-main:#C62828;         /* Merah tegas */
  --red-hover:#A31C1C;        /* Merah tua saat disentuh */
  --red-soft:#FDECEC;         /* Latar merah muda pucat */
  --red-border:#F5BDBD;       /* Bingkai merah halus */

  /* Kuning Emas Pendukung */
  --yellow-main:#F59E0B;      /* Kuning keemasan cerah */
  --yellow-soft:#FEF3C7;      /* Latar kuning lembut */
  --yellow-border:#FCD34D;    /* Bingkai kuning */
  --yellow-dark:#92400E;      /* Kuning kecokelatan untuk teks */

  --danger:#B91C1C;
  --shadow-sm:0 2px 12px rgba(198,40,40,.05);
  --shadow-md:0 10px 28px rgba(198,40,40,.10);
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(180deg,#FEF0D5 0%,#FFFDF5 300px);
  color:var(--text-primary);
  line-height:1.6;
  font-size:16px;
  padding-bottom:64px;
}
.container{max-width:1120px;margin:0 auto;padding:0 20px}

/* Header */
.topbar{
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(10px);
  border-bottom:2px solid var(--yellow-border);
  padding:18px 0;
  position:sticky;
  top:0;
  z-index:30;
}
.topbar-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.brand-badge{
  width:48px;
  height:48px;
  border-radius:15px;
  background:linear-gradient(135deg,#D32F2F 0%,#F59E0B 100%);
  color:#FFFFFF;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  font-size:20px;
  letter-spacing:-.5px;
  flex-shrink:0;
  box-shadow:0 4px 14px rgba(198,40,40,.25);
}
.brand-text h1{font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--red-main)}
.brand-text p{font-size:14px;color:var(--text-secondary)}
.topbar-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Tombol */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  padding:10px 16px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-soft);
  background:var(--bg-card);
  color:var(--text-primary);
  cursor:pointer;
  transition:all .18s ease;
}
.btn:hover{background:var(--yellow-soft);border-color:var(--yellow-main);color:var(--red-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{
  background:linear-gradient(135deg,#D32F2F 0%,#B71C1C 100%);
  color:#FFFFFF;
  border-color:var(--red-main);
  box-shadow:0 4px 12px rgba(198,40,40,.24);
}
.btn-primary:hover{
  background:linear-gradient(135deg,#B71C1C 0%,#8E1313 100%);
  border-color:var(--red-hover);
  color:#FFFFFF;
}

.section{margin-top:26px}
.section-title{font-size:17.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.section-subtitle{
  font-size:13.5px;
  font-weight:700;
  color:var(--yellow-dark);
  background:var(--yellow-soft);
  padding:4px 14px;
  border-radius:999px;
  border:1px solid var(--yellow-border);
}

/* Kartu Input Utama */
.quick-entry-card{
  background:var(--bg-card);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:24px;
  box-shadow:var(--shadow-md);
  position:relative;
  overflow:hidden;
}
.quick-entry-card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:6px;
  height:100%;
  background:linear-gradient(180deg,#C62828 0%,#F59E0B 100%);
}
.entry-grid{display:grid;grid-template-columns:1.1fr 1.4fr 1.3fr auto;gap:18px;align-items:end;margin-top:14px}
.field-group label{display:block;font-size:14px;font-weight:600;color:var(--text-secondary);margin-bottom:6px}
.input-control{
  width:100%;
  height:48px;
  padding:0 14px;
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  color:var(--text-primary);
  background:var(--bg-page);
  border:1.5px solid var(--border-soft);
  border-radius:var(--radius-sm);
  transition:border-color .15s ease;
}
.input-control:focus{outline:none;border-color:var(--red-main);background:#FFFFFF}
.stepper-wrap{display:flex;align-items:center;gap:8px}
.btn-step{
  height:48px;
  min-width:54px;
  padding:0 12px;
  border-radius:var(--radius-sm);
  border:1.5px solid var(--yellow-border);
  background:var(--yellow-soft);
  color:var(--yellow-dark);
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s;
}
.btn-step:hover{background:#FDE68A;border-color:var(--yellow-main);color:var(--red-hover)}
.live-preview-box{
  background:var(--red-soft);
  border:1px solid var(--red-border);
  border-radius:var(--radius-sm);
  padding:10px 16px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.live-preview-box span{font-size:14px;color:var(--red-hover);font-weight:600}
.live-preview-box strong{font-size:18px;color:var(--red-main);font-weight:800}
.btn-save-large{height:48px;padding:0 24px;font-size:15px;font-weight:700;border-radius:var(--radius-sm)}
.settings-bar{
  margin-top:16px;
  padding-top:14px;
  border-top:1px dashed var(--border-soft);
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:14px;
  color:var(--text-secondary);
}
.inline-setting{display:inline-flex;align-items:center;gap:8px}
.inline-setting input{
  width:115px;
  height:36px;
  padding:0 10px;
  font-family:inherit;
  font-size:14px;
  font-weight:700;
  border:1px solid var(--border-soft);
  border-radius:8px;
  background:var(--bg-page);
  color:var(--text-primary);
}

/* Filter Bulan & Hari */
.filter-bar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:var(--bg-card);
  padding:14px 18px;
  border-radius:var(--radius-md);
  border:1px solid var(--border-soft);
  box-shadow:var(--shadow-sm);
}
.pill-group{display:flex;flex-wrap:wrap;gap:8px}
.pill-btn{
  padding:8px 16px;
  border-radius:999px;
  border:1px solid var(--border-soft);
  background:var(--bg-page);
  color:var(--text-secondary);
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:all .15s ease;
}
.pill-btn:hover{border-color:var(--red-main);color:var(--red-main)}
.pill-btn.active{
  background:var(--red-main);
  color:#FFFFFF;
  border-color:var(--red-main);
  box-shadow:0 3px 10px rgba(198,40,40,.24);
}
.day-select{
  height:38px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--yellow-border);
  background:var(--yellow-soft);
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  color:var(--yellow-dark);
  cursor:pointer;
}

/* Kartu KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi-card{
  background:var(--bg-card);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:20px 22px;
  box-shadow:var(--shadow-sm);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.kpi-card.highlight{
  background:linear-gradient(145deg,#C62828 0%,#991B1B 100%);
  color:#FFFFFF;
  border:none;
  box-shadow:0 10px 24px rgba(198,40,40,.25);
}
.kpi-label{font-size:14px;font-weight:600;color:var(--text-secondary);margin-bottom:8px}
.kpi-card.highlight .kpi-label{color:#FDE68A}
.kpi-value{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.2;margin-bottom:8px;color:var(--text-primary)}
.kpi-card.highlight .kpi-value{color:#FFFFFF}
.kpi-card:nth-child(2) .kpi-value{color:var(--red-main)}
.kpi-card:nth-child(3) .kpi-value{color:#B45309}
.kpi-card:nth-child(4) .kpi-value{color:var(--yellow-dark)}
.kpi-note{font-size:13px;color:var(--text-muted);font-weight:500}
.kpi-card.highlight .kpi-note{color:#FECACA}

/* Grafik & Sorotan */
.charts-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.card-box{background:var(--bg-card);border:1px solid var(--border-soft);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm)}
.card-header{margin-bottom:16px}
.card-header h3{font-size:17px;font-weight:700;color:var(--text-primary)}
.card-header p{font-size:13.5px;color:var(--text-secondary);margin-top:2px}
.chart-wrapper{position:relative;height:270px;width:100%}
.insight-strip{
  background:linear-gradient(90deg,#FEF3C7 0%,#FDECEC 100%);
  border:1px solid var(--yellow-border);
  border-radius:var(--radius-md);
  padding:16px 20px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-size:14.5px;
  color:var(--text-primary);
}
.insight-strip strong{font-weight:700;color:var(--red-main)}

/* Tabel Buku Catatan */
.table-controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.search-input{
  height:42px;
  padding:0 14px;
  border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);
  font-family:inherit;
  font-size:14px;
  background:var(--bg-page);
  color:var(--text-primary);
  min-width:250px;
}
.search-input:focus{outline:none;border-color:var(--red-main);background:#FFFFFF}
.table-responsive{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{
  font-size:13px;
  font-weight:700;
  color:var(--red-hover);
  text-transform:uppercase;
  letter-spacing:.4px;
  padding:13px 14px;
  border-bottom:2px solid var(--yellow-border);
  background:var(--yellow-soft);
}
td{padding:14px;border-bottom:1px solid var(--border-soft);font-size:15px}
tr:hover td{background:#FFF9EB}
.badge-day{
  display:inline-block;
  padding:4px 10px;
  border-radius:8px;
  font-size:13px;
  font-weight:600;
  background:var(--yellow-soft);
  color:var(--yellow-dark);
}
.text-profit{color:var(--red-main);font-weight:700}
.action-btns{display:flex;gap:6px}
.btn-mini{
  padding:6px 12px;
  font-size:13px;
  font-weight:600;
  border-radius:8px;
  border:1px solid var(--border-soft);
  background:#FFFFFF;
  color:var(--text-primary);
  cursor:pointer;
  font-family:inherit;
}
.btn-mini.edit:hover{background:var(--yellow-soft);border-color:var(--yellow-main);color:var(--yellow-dark)}
.btn-mini.del:hover{background:var(--red-soft);border-color:var(--danger);color:var(--danger)}
.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:14px;color:var(--text-secondary)}

/* Notifikasi Toast & Halaman Login */
.toast{
  position:fixed;
  bottom:24px;
  right:24px;
  background:var(--red-main);
  color:#FFFFFF;
  border:1px solid var(--yellow-border);
  padding:14px 20px;
  border-radius:var(--radius-md);
  font-size:14px;
  font-weight:600;
  box-shadow:0 10px 25px rgba(198,40,40,.28);
  transform:translateY(100px);
  opacity:0;
  transition:all .25s ease;
  z-index:100;
}
.toast.show{transform:translateY(0);opacity:1}
.login-wrap{max-width:460px;margin:60px auto 0;padding:0 20px}
.login-wrap .field-group{margin-top:14px}
.login-err{color:var(--danger);font-weight:700;font-size:14px;margin-top:12px;min-height:20px}

@media (max-width:900px){.entry-grid{grid-template-columns:1fr 1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}.charts-grid{grid-template-columns:1fr}}
@media (max-width:560px){.entry-grid{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr}.kpi-value{font-size:23px}}
</style>
</head>
<body>

<!-- Halaman masuk -->
<div id="viewLogin" class="login-wrap" hidden>
  <div class="quick-entry-card">
    <div class="brand" style="margin-bottom:6px">
      <div class="brand-badge">Rp</div>
      <div class="brand-text"><h1>Catatan Keuangan Gorengan</h1><p>Masuk dengan nomor HP dan PIN 6 angka</p></div>
    </div>
    <div class="field-group" id="namaWrap" hidden><label for="nama">Nama Anda</label><input id="nama" class="input-control" autocomplete="name" /></div>
    <div class="field-group"><label for="hp">Nomor HP</label><input id="hp" class="input-control" inputmode="numeric" placeholder="Contoh: 081234567890" autocomplete="tel" /></div>
    <div class="field-group"><label for="pin">PIN (6 angka)</label><input id="pin" type="password" class="input-control" inputmode="numeric" maxlength="6" autocomplete="current-password" /></div>
    <p class="login-err" id="errL"></p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
      <button class="btn btn-primary btn-save-large" id="kirim">Masuk</button>
      <button class="btn" id="ganti">Belum punya akun? Daftar</button>
    </div>
  </div>
</div>

<div id="viewApp" hidden>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="brand-badge">Rp</div>
        <div class="brand-text">
          <h1>Catatan Keuangan Gorengan</h1>
          <p id="userName">Ringkasan untung, modal, dan penjualan harian usaha Anda</p>
        </div>
      </div>
      <div class="topbar-actions">
        <label class="btn" for="excelUpload" title="Gabungkan catatan dari file Excel">
          Unggah Excel
          <input type="file" id="excelUpload" accept=".xlsx,.xls" style="display:none" />
        </label>
        <button class="btn" id="btnExportExcel">Simpan ke Excel</button>
        <button class="btn" id="btnKeluar">Keluar</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <div class="quick-entry-card">
        <div class="section-title" style="margin-bottom:4px;">
          <span id="formTitle">Catat Hasil Jualan Hari Ini</span>
          <span class="section-subtitle">Tersimpan aman
